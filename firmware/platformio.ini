; SteamMachine UM790 - Firmware ESP32
;
; Placa: ESP32-WROOM-32D DevKit clasico (modelo HW-394)
; Ver docs/05_Firmware_Architecture.md y docs/07_Hardware_Specification.md

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5
    fastled/FastLED @ 3.7.8   ; FIJADA (sin ^): FastLED 3.10.x tiene un fallo de
                                ; compilacion conocido y abierto en su modulo interno
                                ; fl::/rbtree.h con el compilador de este toolchain
                                ; (ver github.com/FastLED/FastLED/issues/2090).
                                ; ^3.7.0 dejaba que PlatformIO cogiera esa version
                                ; rota; 3.7.8 es la ultima de la rama 3.7.x, estable
                                ; y usada por otros como solucion a este mismo fallo.

build_flags =
    -Wall
    -DDEBUG_SERIAL2=0   ; 1 = logs de depuracion por Serial2 (pines 16/17). 0 = silencio total.
                        ; Nunca imprimir por Serial (USB): rompe el protocolo JSON con el PC.
